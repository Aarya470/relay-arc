name: Supabase keepalive

# The free-tier Supabase project pauses after 7 days without API activity.
# This pings an endpoint that performs a real database query, once a day,
# independently of Vercel's cron jobs.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Relay live endpoint (queries the emergencies table)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://relay-arc.vercel.app/api/emergency/live/00000000-0000-0000-0000-000000000000")
          echo "response: $code (404 is expected — the query ran, no such row)"
          if [ "$code" != "404" ] && [ "$code" != "200" ]; then exit 1; fi
